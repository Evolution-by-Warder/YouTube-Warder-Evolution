name: Source regression checks (no IPK publishing)
on:
  push:
    branches: [feature/native-search-v002]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run unit tests only
        run: python3 -m unittest discover -s tests -v
