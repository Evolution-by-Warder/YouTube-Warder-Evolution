name: Native YouTube scaffold source tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python3 -m unittest discover -s tests -v
          python3 -m compileall -q plugin/Plugins/Extensions/WarderYouTube
