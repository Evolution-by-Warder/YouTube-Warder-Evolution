name: YouTube Data API live smoke (secret)

# Only the maintainer-controlled work branch can run with the repository secret.
# Never use pull_request/pull_request_target or upload response artifacts here.
on:
  push:
    branches:
      - feature/native-search-v002
    paths:
      - .github/workflows/live-youtube-smoke.yml
      - tests/live_youtube_smoke.py
      - plugin/Plugins/Extensions/WarderYouTube/api.py
      - plugin/Plugins/Extensions/WarderYouTube/thumbnails.py
      - plugin/Plugins/Extensions/WarderYouTube/video_metadata.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: warder-youtube-live-smoke
  cancel-in-progress: false

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    # The secret is never injected for untrusted pull-request events.
    env:
      WARDER_TEST_API_KEY: ${{ secrets.WARDER_YOUTUBE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test live public search and one thumbnail
        run: python3 tests/live_youtube_smoke.py
