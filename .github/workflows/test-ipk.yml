name: Build 0.0.8~test4 IPK (receiver test only)

on:
  workflow_dispatch:
  push:
    branches: [feature/native-search-v002]
    paths:
      - .github/workflows/test-ipk.yml

permissions:
  contents: write

jobs:
  build-test-ipk:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate source and IPK package scripts
        run: python3 -m unittest discover -s tests -v
      - name: Build test IPK
        run: python3 tools/build_test_ipk.py --output dist
      - name: Inspect Debian/opkg archive members
        run: |
          set -eu
          ar t dist/*.ipk
          ar p dist/*.ipk control.tar.gz | tar -tzf -
          ar p dist/*.ipk data.tar.gz | tar -tzf -
          cd dist && sha256sum -c *.sha256
      - name: Restore exact test4 release asset filename for installed updater
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          ASSET=740732471
          EXPECTED="enigma2-plugin-extensions-youtube-warder-evolution_0.0.8~test4_all.ipk"
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/assets/$ASSET" -f name="$EXPECTED" >/dev/null
          GOT="$(gh api "repos/$GITHUB_REPOSITORY/releases/assets/$ASSET" --jq .name)"
          echo "Release asset name: $GOT"
          test "$GOT" = "$EXPECTED"
      - uses: actions/upload-artifact@v4
        with:
          name: WarderYouTube-0.0.8-test4-IPK
          path: |
            dist/*.ipk
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14
