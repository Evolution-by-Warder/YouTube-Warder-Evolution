name: Build 0.0.8~test6 IPK (receiver test only)

on:
  workflow_dispatch:
  push:
    branches: [feature/native-search-v002]
    paths:
      - .github/workflows/test-ipk.yml

permissions:
  contents: write

jobs:
  build-test-ipk:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate source and IPK package scripts
        run: python3 -m unittest discover -s tests -v
      - name: Build test IPK
        run: python3 tools/build_test_ipk.py --output dist
      - name: Inspect Debian/opkg archive members
        run: |
          set -eu
          ar t dist/*.ipk
          ar p dist/*.ipk control.tar.gz | tar -tzf -
          ar p dist/*.ipk data.tar.gz | tar -tzf -
          cd dist && sha256sum -c *.sha256
      - name: Publish test6 prerelease + verified testing feed
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          TAG="youtube-warder-v0.0.8-test6"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Refusing to replace an existing test prerelease."
            exit 1
          fi
          gh release create "$TAG" dist/*.ipk dist/*.sha256 \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "YouTube Warder Evolution 0.0.8-test6 — Favourites and History" \
            --notes "Owner-approved receiver test, not a stable release. New favourites (MENU), local watch-open history, native saved video playback, safer updater confirmations. GigaBlue/OpenATV 8.1 tests pending." \
            --prerelease
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          from urllib.request import urlopen
          package = next(Path("dist").glob("*.ipk"))
          assert package.name.endswith("_0.0.8~test6_all.ipk")
          manifest_url = ("https://github.com/Evolution-by-Warder/YouTube-Warder-Evolution/"
                          "releases/download/youtube-warder-v0.0.8-test6/"
                          + package.name.replace("~", "."))
          payload = {
              "schema": 1, "product": "YouTube Warder Evolution",
              "channel": "testing",
              "release": {
                  "version": "0.0.8~test6",
                  "tag": "youtube-warder-v0.0.8-test6",
                  "url": manifest_url,
                  "sha256": hashlib.sha256(package.read_bytes()).hexdigest(),
                  "bytes": package.stat().st_size,
                  "notes": ("Test6: Obľúbené (MENU), História, prehrávanie uložených videí, "
                            "ochrana aktualizátora pred dvojitou inštaláciou. "
                            "Testovacia verzia na overenie na GigaBlue.")
              }
          }
          Path("/tmp/warder-youtube-test6-feed.json").write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8")
          PY
          REAL="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[] | select(.name | endswith(".ipk")) | .name')"
          EXPECTED="$(basename dist/*.ipk | sed 's/~/./g')"
          echo "Uploaded asset: $REAL"
          test "$REAL" = "$EXPECTED"
          SIZE="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" \
            --jq '.assets[] | select(.name | endswith(".ipk")) | .size')"
          test "$SIZE" = "$(stat -c%s dist/*.ipk)"
          SHA="$(gh api "repos/$GITHUB_REPOSITORY/contents/update/testing.json?ref=feature/native-search-v002" --jq .sha)"
          B64="$(base64 -w 0 /tmp/warder-youtube-test6-feed.json)"
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/update/testing.json" \
            -f message="Publish opt-in test6 in YouTube updater testing feed" \
            -f branch="feature/native-search-v002" -f sha="$SHA" -f content="$B64" > /dev/null
          echo "PASS: test6 prerelease asset and owner opt-in feed published"
      - uses: actions/upload-artifact@v4
        with:
          name: WarderYouTube-0.0.8-test6-IPK
          path: |
            dist/*.ipk
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14
