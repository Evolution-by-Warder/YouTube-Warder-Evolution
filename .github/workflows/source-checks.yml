name: Source regression checks (no IPK publishing)
on:
  push:
    branches: [feature/native-search-v002]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run unit tests only
        run: python3 -m unittest discover -s tests -v
      - name: Build receiver-test-only IPK
        run: python3 tools/build_test_ipk.py --output dist
      - name: Upload private testing candidate as Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: WarderYouTube-test43-inline-odbery-quick-selection-IPK
          path: |
            dist/*.ipk
            dist/*.sha256
          retention-days: 7
          if-no-files-found: error
