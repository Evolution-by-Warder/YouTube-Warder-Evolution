name: Native YouTube scaffold source tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python3 -m unittest discover -s tests -v
          python3 -m compileall -q plugin/Plugins/Extensions/WarderYouTube
      - name: Build non-publishing receiver-test IPK
        run: python3 tools/build_test_ipk.py --output dist
      - name: Verify package SHA256 and archive
        run: |
          set -eu
          cd dist
          sha256sum -c *.sha256
          ar t *.ipk
      - uses: actions/upload-artifact@v4
        with:
          name: WarderYouTube-settings-mainmenu-test-IPK
          path: |
            dist/*.ipk
            dist/*.sha256
          retention-days: 14
          if-no-files-found: error
