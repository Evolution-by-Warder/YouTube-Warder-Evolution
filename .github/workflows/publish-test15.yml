name: One-shot publish verified test15 focused-video IPK
on:
  push:
    branches: [feature/native-search-v002]
    paths: [.github/workflows/publish-test15.yml]
permissions:
  contents: write
  actions: read
concurrency:
  group: warder-youtube-test15-verified
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/feature/native-search-v002'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: WarderYouTube-0.0.8-test15-IPK
          run-id: 43441800412
          github-token: ${{ github.token }}
          path: dist
      - name: Verify exact pinned IPK, version, and focused-video assets
        shell: bash
        run: |
          set -euo pipefail
          ipk='dist/enigma2-plugin-extensions-youtube-warder-evolution_0.0.8~test15_all.ipk'
          test "$(stat -c %s "$ipk")" = 165488
          echo "4a5e8386f09de33c9b46cd3fac42d30ad35859ff8d53c7f4d898044fca25d859  $ipk" | sha256sum -c -
          cd dist
          sha256sum -c *.sha256
          ar p *.ipk control.tar.gz | tar -xzOf - ./control | grep -Fx 'Version: 0.0.8~test15'
          ar p *.ipk control.tar.gz | tar -xzOf - ./control | grep -Fx 'Architecture: all'
          ar p *.ipk data.tar.gz | tar -tzf - | grep -F 'images/grid_focus.png'
          ar p *.ipk data.tar.gz | tar -tzf - | grep -F 'images/video_focus.png'
      - name: Publish opt-in testing prerelease and verify stored bytes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/feature/native-search-v002'
          tag='youtube-warder-v0.0.8-test15'
          if gh release view "$tag" >/dev/null 2>&1; then
            echo 'Existing test15 release; validating exact bytes'
          else
            gh release create "$tag" \
              'dist/enigma2-plugin-extensions-youtube-warder-evolution_0.0.8~test15_all.ipk' \
              'dist/enigma2-plugin-extensions-youtube-warder-evolution_0.0.8~test15_all.ipk.sha256' \
              --target feature/native-search-v002 \
              --title 'YouTube Warder Evolution 0.0.8~test15 (TEST ONLY)' \
              --notes 'Owner-approved opt-in GigaBlue/OpenATV receiver candidate. All video tiles (Home/History/Favourites/Search): slim darker inactive borders and bright cyan focus only on active video; native transparent PNG with no thumbnail overlay. Also includes all test14 UI/backend corrections and thin Glass System Utility footer on 12 screens. 190 offline checks PASS; physical receiver verification pending. No stable release or main merge.' \
              --prerelease
          fi
          test "$(gh release view "$tag" --json isPrerelease --jq '.isPrerelease')" = true
          mkdir -p verify
          gh release download "$tag" --dir verify --pattern '*.ipk'
          cmp 'dist/enigma2-plugin-extensions-youtube-warder-evolution_0.0.8~test15_all.ipk' \
            'verify/enigma2-plugin-extensions-youtube-warder-evolution_0.0.8.test15_all.ipk'
          echo 'PASS: exact published test15 asset byte-for-byte verified'
