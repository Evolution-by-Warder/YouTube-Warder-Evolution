name: Build 0.0.8~test5 IPK (receiver test only)

on:
  workflow_dispatch:
  push:
    branches: [feature/native-search-v002]
    paths:
      - .github/workflows/test-ipk.yml

permissions:
  contents: write

jobs:
  build-test-ipk:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate source and IPK package scripts
        run: python3 -m unittest discover -s tests -v
      - name: Build test IPK
        run: python3 tools/build_test_ipk.py --output dist
      - name: Inspect Debian/opkg archive members
        run: |
          set -eu
          ar t dist/*.ipk
          ar p dist/*.ipk control.tar.gz | tar -tzf -
          ar p dist/*.ipk data.tar.gz | tar -tzf -
          cd dist && sha256sum -c *.sha256
      - name: Publish opt-in test5 GitHub prerelease and testing manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          TAG="youtube-warder-v0.0.8-test5"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Refusing to overwrite an existing prerelease."
            exit 1
          fi
          gh release create "$TAG" dist/*.ipk dist/*.sha256 \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "YouTube Warder Evolution 0.0.8-test5 (receiver test)" \
            --notes "Test-only updater URL normalization fix. Independent native playback and JPEG thumbnail improvements. Hardware verification pending." \
            --prerelease
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          pkg = next(Path("dist").glob("*.ipk"))
          version = "0.0.8~test5"
          tag = "youtube-warder-v0.0.8-test5"
          url_name = pkg.name.replace("~", ".")
          url = "https://github.com/Evolution-by-Warder/YouTube-Warder-Evolution/releases/download/" + tag + "/" + url_name
          manifest = {
              "schema": 1, "product": "YouTube Warder Evolution",
              "channel": "testing",
              "release": {
                  "version": version, "tag": tag, "url": url,
                  "sha256": hashlib.sha256(pkg.read_bytes()).hexdigest(),
                  "bytes": pkg.stat().st_size,
                  "notes": "Test5: oprava priameho aktualizátora, HLS/DASH/MP4, náhľady a bezpečný EXIT. Test na prijímači ešte potrebný."
              }
          }
          Path("/tmp/warder-testing.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
          REAL="$(gh release view "$TAG" --json assets --jq '.assets[] | select(.name | endswith(".ipk")) | .name')"
          EXPECTED="$(ls dist/*.ipk | xargs -n1 basename | sed 's/~/./g')"
          test "$REAL" = "$EXPECTED"
          SHA="$(gh api "repos/$GITHUB_REPOSITORY/contents/update/testing.json?ref=feature/native-search-v002" --jq .sha)"
          B64="$(base64 -w 0 /tmp/warder-testing.json)"
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/update/testing.json" \
            -f message="Point testing updater to version 0.0.8~test5 prerelease" \
            -f branch="feature/native-search-v002" -f sha="$SHA" -f content="$B64" >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: WarderYouTube-0.0.8-test5-IPK
          path: |
            dist/*.ipk
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14
