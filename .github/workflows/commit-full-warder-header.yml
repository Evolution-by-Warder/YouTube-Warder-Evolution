name: Commit single clean Warder-family YouTube header image
on:
  push:
    branches: [feature/native-search-v002]
    paths: [.github/workflows/commit-full-warder-header.yml]
permissions:
  contents: write
jobs:
  render-and-commit:
    if: github.ref == 'refs/heads/feature/native-search-v002'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/native-search-v002
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build-only typography dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check 'pillow==12.3.0'
          if test ! -f /usr/share/fonts/truetype/lato/Lato-Heavy.ttf || test ! -f /usr/share/fonts/opentype/urw-base35/Z003-MediumItalic.otf; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y fonts-lato fonts-urw-base35
          fi
      - name: Generate one complete static PNG from canonical Warder source
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/render_full_header.py --output plugin/Plugins/Extensions/WarderYouTube/images/warder_header.png
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, struct
          p=Path('plugin/Plugins/Extensions/WarderYouTube/images/warder_header.png')
          b=p.read_bytes()
          assert b.startswith(bytes((137,80,78,71,13,10,26,10)))
          assert struct.unpack('>II',b[16:24]) == (1920,152)
          assert b[24:26]==bytes((8,2))
          assert 50000 < len(b) < 350000
          print('PASS: ONE native RGB family header, no patch overlays; sha256',hashlib.sha256(b).hexdigest())
          PY
      - name: Commit exact final ready-to-display PNG to test branch
        shell: bash
        run: |
          set -euo pipefail
          git add plugin/Plugins/Extensions/WarderYouTube/images/warder_header.png
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'art: add one seamless full Warder header PNG with clean GSU-style signature'
          git push origin HEAD:feature/native-search-v002
      - uses: actions/upload-artifact@v4
        with:
          name: Warder-full-header-one-image-visual-QA
          path: plugin/Plugins/Extensions/WarderYouTube/images/warder_header.png
          retention-days: 7
